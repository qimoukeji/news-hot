name: news-hot

x-backend: &backend
  image: ${DEPLOY_IMAGE:?Use the image for the verified commit}
  env_file: ${NEWSHOT_ENV_FILE:?Use the private server env file}
  restart: unless-stopped
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://newshot:${POSTGRES_PASSWORD:?}@db:5432/newshot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    MCP_ALLOWED_HOSTS: web
  volumes:
    - data:/data

services:
  db:
    image: ${DEPLOY_DB_IMAGE:?Use the verified PostgreSQL 18 image ID}
    restart: unless-stopped
    environment:
      POSTGRES_USER: newshot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: newshot
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U newshot -d newshot]
      interval: 5s
      timeout: 5s
      retries: 30

  setup:
    <<: *backend
    restart: "no"
    command: [sh, -c, "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: [node, apps/api/src/main.ts]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"

  worker:
    <<: *backend
    command: [node, apps/worker/src/main.ts]
    stop_grace_period: 210s

  web:
    image: ${DEPLOY_IMAGE:?}
    restart: unless-stopped
    command: [node, apps/web/server.ts]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:?}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${RELEASE_SHA:?}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db: {}
  data: {}
